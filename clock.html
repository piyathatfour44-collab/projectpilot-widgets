<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#0B0614;font-family:ui-monospace,Menlo,Consolas,monospace;color:#E9E6FF;overflow:hidden}
.w{height:100%;min-height:110px;box-sizing:border-box;border:1px solid #3a2a5e;border-radius:10px;padding:12px 16px;background:#120a22;display:flex;flex-direction:column;justify-content:center}
.h{font-size:12px;letter-spacing:.3em;color:#FF2BD6;font-weight:700}
.t{font-size:52px;font-weight:800;color:#F5FF3B;text-shadow:0 0 10px rgba(245,255,59,.7);text-align:center;letter-spacing:.04em}
.d{font-size:12px;letter-spacing:.25em;color:#00E5FF;text-align:center}
</style></head><body><div class="w"><div class="h">◢ CLOCK</div><div class="t" id="t">--:--</div><div class="d" id="d"></div></div>
<script>
function u(){var n=new Date(),o={timeZone:'Asia/Bangkok'};
document.getElementById('t').textContent=n.toLocaleTimeString('en-GB',Object.assign({hour:'2-digit',minute:'2-digit'},o));
document.getElementById('d').textContent=n.toLocaleDateString('en-GB',Object.assign({weekday:'short',day:'numeric',month:'short'},o)).toUpperCase().replace(',','');}
u();setInterval(u,1000);
</script></body></html>
