<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#fff;--card:#fff;--ink:#18181B;--mu:#71717A;--ln:#E4E4E7;--soft:#F4F4F5;--blue:#DBEAFE;--blueT:#1E40AF;--green:#DCFCE7;--greenT:#166534;
--chrome:radial-gradient(circle at 35% 30%,#fff 0,#E4E4E7 18%,#A1A1AA 42%,#3F3F46 72%,#D4D4D8 100%)}
@media (prefers-color-scheme: dark){:root{--bg:#191919;--card:#202020;--ink:#F4F4F5;--mu:#A1A1AA;--ln:#2F2F2F;--soft:#2A2A2A;--blue:#1E3A8A;--blueT:#DBEAFE;--green:#14532D;--greenT:#DCFCE7}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.w{height:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.h{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.sub{font-size:12px;color:var(--mu)}
.sphere{border-radius:50%;background:var(--chrome);box-shadow:0 14px 28px rgba(0,0,0,.18)}
.w{display:flex;flex-direction:column;justify-content:center;min-height:110px}
.t{font-size:48px;font-weight:800;letter-spacing:-.03em;margin:2px 0}
.pill{display:inline-block;background:#FEE2E2;color:#B91C1C;font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px}
@media (prefers-color-scheme: dark){.pill{background:#7F1D1D;color:#FEE2E2}}
html,body{overflow:hidden}
</style></head><body><div class="w"><div class="h">Clock</div><div class="t" id="t">--:--</div><div><span class="pill" id="d"></span></div></div>
<script>
function u(){var n=new Date(),o={timeZone:'Asia/Bangkok'};
document.getElementById('t').textContent=n.toLocaleTimeString('en-GB',Object.assign({hour:'2-digit',minute:'2-digit'},o));
document.getElementById('d').textContent=n.toLocaleDateString('en-GB',Object.assign({weekday:'short',day:'numeric',month:'short'},o)).toUpperCase().replace(',','');}
u();setInterval(u,1000);
</script></body></html>
