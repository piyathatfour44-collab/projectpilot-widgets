<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#fff;--card:#fff;--ink:#18181B;--mu:#71717A;--ln:#E4E4E7;--soft:#F4F4F5;--blue:#DBEAFE;--blueT:#1E40AF;--green:#DCFCE7;--greenT:#166534;
--chrome:radial-gradient(circle at 35% 30%,#fff 0,#E4E4E7 18%,#A1A1AA 42%,#3F3F46 72%,#D4D4D8 100%)}
@media (prefers-color-scheme: dark){:root{--bg:#191919;--card:#202020;--ink:#F4F4F5;--mu:#A1A1AA;--ln:#2F2F2F;--soft:#2A2A2A;--blue:#1E3A8A;--blueT:#DBEAFE;--green:#14532D;--greenT:#DCFCE7}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.w{height:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.h{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.sub{font-size:12px;color:var(--mu)}
.sphere{border-radius:50%;background:var(--chrome);box-shadow:0 14px 28px rgba(0,0,0,.18)}
.w{display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:140px}
.r{display:flex;gap:10px}.c{text-align:center;flex:1}
.n{background:var(--soft);border-radius:10px;padding:8px 0;font-size:30px;font-weight:800;letter-spacing:-.02em}
.l{font-size:11px;color:var(--mu);margin-top:4px}
.top{display:flex;justify-content:space-between;align-items:center}
.pill{background:var(--blue);color:var(--blueT);font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px}
</style></head><body><div class="w"><div class="top"><div class="h">Go-live countdown</div><span class="pill">28 Nov</span></div>
<div class="r"><div class="c"><div class="n" id="d">00</div><div class="l">days</div></div><div class="c"><div class="n" id="h">00</div><div class="l">hours</div></div><div class="c"><div class="n" id="m">00</div><div class="l">min</div></div><div class="c"><div class="n" id="s">00</div><div class="l">sec</div></div></div></div>
<script>
var T=Date.parse('2026-11-28T00:00:00+07:00');
function p(x){return(x<10?'0':'')+x}
function u(){var r=Math.max(0,Math.floor((T-Date.now())/1000));
document.getElementById('d').textContent=p(Math.floor(r/86400));document.getElementById('h').textContent=p(Math.floor(r%86400/3600));
document.getElementById('m').textContent=p(Math.floor(r%3600/60));document.getElementById('s').textContent=p(r%60);}
u();setInterval(u,1000);
</script></body></html>
