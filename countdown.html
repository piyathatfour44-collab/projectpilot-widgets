<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#0B0614;font-family:ui-monospace,Menlo,Consolas,monospace;color:#E9E6FF}
.w{height:100%;min-height:150px;box-sizing:border-box;border:1px solid #3B2560;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:radial-gradient(circle at 50% 120%,rgba(0,229,255,.25),transparent 60%),#0B0614}
.h{font-size:12px;letter-spacing:.3em;color:#00E5FF}
.r{display:flex;gap:8px}.c{text-align:center}
.n{min-width:54px;padding:6px 4px;background:#140C24;border:1px solid #FF2BD6;color:#F5FF3B;font-size:30px;font-weight:800;text-shadow:0 0 8px rgba(245,255,59,.6)}
.l{font-size:10px;letter-spacing:.2em;color:#B9B3E0;margin-top:4px}
</style></head><body><div class="w"><div class="h">◢ GO-LIVE · 28 NOV</div>
<div class="r"><div class="c"><div class="n" id="d">00</div><div class="l">DAYS</div></div><div class="c"><div class="n" id="h">00</div><div class="l">HRS</div></div><div class="c"><div class="n" id="m">00</div><div class="l">MIN</div></div><div class="c"><div class="n" id="s">00</div><div class="l">SEC</div></div></div></div>
<script>
var T=Date.parse('2026-11-28T00:00:00+07:00');
function p(x){return(x<10?'0':'')+x}
function u(){var r=Math.max(0,Math.floor((T-Date.now())/1000));
document.getElementById('d').textContent=p(Math.floor(r/86400));document.getElementById('h').textContent=p(Math.floor(r%86400/3600));
document.getElementById('m').textContent=p(Math.floor(r%3600/60));document.getElementById('s').textContent=p(r%60);}
u();setInterval(u,1000);
</script></body></html>
