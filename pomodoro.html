<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#0B0614;font-family:ui-monospace,Menlo,Consolas,monospace;color:#E9E6FF}
.w{height:100%;min-height:220px;box-sizing:border-box;border:1px solid #B026FF;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
background:radial-gradient(circle at 50% 0%,rgba(176,38,255,.35),transparent 60%),#0B0614}
.h{font-size:12px;letter-spacing:.3em;color:#00E5FF}
.t{font-size:56px;font-weight:800;color:#FF2BD6;text-shadow:0 0 10px #FF2BD6,0 0 28px #B026FF}
.r{display:flex;gap:8px}
button{font:inherit;font-size:13px;letter-spacing:.15em;background:transparent;color:#00E5FF;border:1px solid #00E5FF;padding:8px 14px;cursor:pointer}
button.p{background:#FF2BD6;color:#0B0614;border-color:#FF2BD6;font-weight:700}
.m{display:flex;gap:6px}.m button{font-size:11px;padding:4px 8px;color:#B9B3E0;border-color:#4a3a6e}
.m button.on{color:#F5FF3B;border-color:#F5FF3B}
/* Light theme: matches the Home cover (teal to pink). Dark mode keeps the neon look. */
@media (prefers-color-scheme: light){
html,body,button{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif !important}
html,body{background:transparent;color:#2E3550}
.w{border:none;border-radius:14px;background:linear-gradient(180deg,#8FD3D8,#D9948F)}
.h{color:#fff;font-weight:700}.t{color:#fff;text-shadow:0 2px 12px rgba(60,40,80,.35)}
button{color:#2E3550;border-color:#fff;background:rgba(255,255,255,.35);border-radius:8px}
button.p{background:#fff;color:#C0606A;border-color:#fff}
.m button{color:#2E3550;border-color:rgba(255,255,255,.7)}.m button.on{color:#fff;border-color:#fff;background:rgba(255,255,255,.2)}
}
</style></head><body><div class="w">
<div class="h">◢ FOCUS</div><div class="t" id="t">25:00</div>
<div class="m"><button class="on" data-m="25">pomodoro</button><button data-m="5">short break</button><button data-m="15">long break</button></div>
<div class="r"><button class="p" id="s">START</button><button id="x">RESET</button></div></div>
<script>
var len=25*60,left=len,run=null,end=0,T=document.getElementById('t'),S=document.getElementById('s');
function show(){var m=Math.floor(left/60),s=left%60;T.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function tick(){left=Math.max(0,Math.round((end-Date.now())/1000));show();if(!left){stop();T.textContent='DONE';}}
function stop(){clearInterval(run);run=null;S.textContent='START';}
S.onclick=function(){if(run){stop();return;}if(!left)left=len;end=Date.now()+left*1000;run=setInterval(tick,250);S.textContent='PAUSE';};
document.getElementById('x').onclick=function(){stop();left=len;show();};
document.querySelectorAll('.m button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.m button').forEach(function(c){c.classList.remove('on')});b.classList.add('on');stop();len=left=b.dataset.m*60;show();}});
</script></body></html>
