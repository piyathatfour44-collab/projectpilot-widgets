<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#0B0614;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
.w{height:100%;min-height:150px;box-sizing:border-box;border:1px solid #3a2a5e;border-radius:10px;padding:12px 16px;background:#120a22;display:flex;flex-direction:column;gap:10px}
.h{font-size:12px;letter-spacing:.3em;color:#00E5FF;font-weight:700}
.g{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;min-height:90px}
.a{border-radius:999px 999px 6px 6px;position:relative;overflow:hidden}
.a:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 40%,rgba(11,6,20,.55))}
.a1{background:linear-gradient(160deg,#FF2BD6,#B026FF 70%,#2b0a46)}
.a2{background:linear-gradient(160deg,#00E5FF,#B026FF 75%,#2b0a46)}
.a3{background:linear-gradient(160deg,#F5FF3B,#FF2BD6 60%,#2b0a46)}
.a4{background:linear-gradient(160deg,#B026FF,#FF2BD6 60%,#2b0a46)}
.s{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.2em;color:#fff;z-index:1;text-shadow:0 0 6px #FF2BD6}
</style></head><body><div class="w"><div class="h">◢ MOOD GALLERY</div>
<div class="g"><div class="a a1"><div class="s">FOCUS</div></div><div class="a a2"><div class="s">BUILD</div></div><div class="a a3"><div class="s">SHIP</div></div><div class="a a4"><div class="s">REST</div></div></div></div></body></html>
