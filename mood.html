<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#fff;--card:#fff;--ink:#18181B;--mu:#71717A;--ln:#E4E4E7;--soft:#F4F4F5;--blue:#DBEAFE;--blueT:#1E40AF;--green:#DCFCE7;--greenT:#166534;
--chrome:radial-gradient(circle at 35% 30%,#fff 0,#E4E4E7 18%,#A1A1AA 42%,#3F3F46 72%,#D4D4D8 100%)}
@media (prefers-color-scheme: dark){:root{--bg:#191919;--card:#202020;--ink:#F4F4F5;--mu:#A1A1AA;--ln:#2F2F2F;--soft:#2A2A2A;--blue:#1E3A8A;--blueT:#DBEAFE;--green:#14532D;--greenT:#DCFCE7}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.w{height:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.h{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.sub{font-size:12px;color:var(--mu)}
.sphere{border-radius:50%;background:var(--chrome);box-shadow:0 14px 28px rgba(0,0,0,.18)}
.w{display:flex;flex-direction:column;gap:12px;min-height:150px}
.g{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;min-height:90px}
.a{border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 0}
.a .sphere{width:52px;height:52px;box-shadow:0 8px 16px rgba(0,0,0,.15)}
.a2 .sphere{background:conic-gradient(from 200deg,#F4F4F5,#71717A,#fff,#A1A1AA,#F4F4F5)}
.a3 .sphere{background:radial-gradient(circle at 60% 40%,#FAFAFA,#D4D4D8 25%,#52525B 55%,#E4E4E7)}
.a4 .sphere{background:radial-gradient(circle at 50% 50%,#fff 0 8%,#A1A1AA 30%,#3F3F46 60%,#E4E4E7)}
.s{font-size:12px;font-weight:600}
html,body{overflow:hidden}
</style></head><body><div class="w"><div class="h">Mood gallery</div>
<div class="g"><div class="a"><div class="sphere"></div><div class="s">Focus</div></div><div class="a a2"><div class="sphere"></div><div class="s">Build</div></div><div class="a a3"><div class="sphere"></div><div class="s">Ship</div></div><div class="a a4"><div class="sphere"></div><div class="s">Rest</div></div></div></div></body></html>
